name: PR policy

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled, assigned, unassigned]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  base-branch:
    name: base-branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Only the release PR from dev may target main
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "Base is $BASE_REF, nothing to check."
            exit 0
          fi

          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            echo "Release PR from $REPOSITORY:dev to main."
            exit 0
          fi

          echo "::error::Pull requests target dev. main only receives the release PR from $REPOSITORY:dev. Change the base branch of this PR to dev."
          exit 1

  linked-issue:
    name: linked-issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require a triaged pull request that closes a triaged issue
        uses: actions/github-script@v9
        with:
          script: |
            const TYPE_LABELS = ['bug', 'enhancement', 'integration', 'documentation', 'maintenance'];
            const TRUSTED = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const isBot = pr.user.type === 'Bot';
            const isRelease = pr.base.ref === 'main' && pr.head.ref === 'dev' && pr.head.repo?.full_name === repository;

            if (isBot || isRelease) {
              core.info('Exempt from the triage rule.');
              return;
            }

            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    authorAssociation
                    labels(first: 50) { nodes { name } }
                    assignees(first: 1) { totalCount }
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                        state
                        repository { nameWithOwner }
                        labels(first: 50) { nodes { name } }
                        assignees(first: 1) { totalCount }
                      }
                    }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, number: pr.number },
            );

            const current = result.repository.pullRequest;
            const labelsOf = (item) => item.labels.nodes.map((label) => label.name);
            const hasType = (item) => labelsOf(item).some((name) => TYPE_LABELS.includes(name));
            const isAccepted = (item) => labelsOf(item).includes('accepted');
            const isAssigned = (item) => item.assignees.totalCount > 0;
            const typeList = TYPE_LABELS.map((name) => `\`${name}\``).join(', ');
            const missing = [];

            if (!hasType(current)) missing.push(`This pull request needs a type label: ${typeList}.`);
            if (!isAssigned(current)) missing.push('This pull request needs an assignee.');

            const openIssues = current.closingIssuesReferences.nodes.filter(
              (issue) => issue.state === 'OPEN' && issue.repository.nameWithOwner === repository,
            );
            const triaged = openIssues.find((issue) => isAccepted(issue) && hasType(issue) && isAssigned(issue));
            const isExternal = !TRUSTED.includes(current.authorAssociation);

            if (triaged) {
              core.info(`Closes triaged issue #${triaged.number}.`);
            } else if (isExternal && isAccepted(current)) {
              core.info('External pull request accepted by a maintainer.');
            } else if (openIssues.length === 0) {
              missing.push(
                isExternal
                  ? 'This pull request needs the `accepted` label from a maintainer, or `Closes #N` pointing to an accepted issue.'
                  : 'This pull request must close an open issue of this repository: add `Closes #N` to its body.',
              );
            } else {
              for (const issue of openIssues) {
                const gaps = [];
                if (!isAccepted(issue)) gaps.push('the `accepted` label');
                if (!hasType(issue)) gaps.push(`a type label (${typeList})`);
                if (!isAssigned(issue)) gaps.push('an assignee');
                missing.push(`Issue #${issue.number} needs ${gaps.join(', ')}.`);
              }
            }

            if (missing.length === 0) return;

            const message = [
              'This pull request is not triaged yet. Missing:',
              ...missing.map((item) => `- ${item}`),
              'The check reruns when the pull request or its issue changes.',
              'See https://github.com/axelhamil/clean-stack/blob/dev/CONTRIBUTING.md',
            ].join('\n');

            await core.summary.addRaw(message, true).write();
            core.setFailed(message);
