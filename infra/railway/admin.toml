"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/admin/prod.Dockerfile"
watchPatterns = [
  "apps/admin/**",
  "infra/caddy/**",
  "packages/ui/**",
  "packages/access-control/**",
  "packages/staff-ui/**",
  "packages/web-kit/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
