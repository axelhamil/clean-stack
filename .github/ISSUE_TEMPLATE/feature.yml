name: Feature
description: Improve the plumbing (auth, billing, email, storage, tooling...).
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: A few lines are enough. We discuss the details here before any code.
    validations:
      required: true
